name: CDK
on:
  push:
    branches:
      - main
# Required permissions
permissions: read-all
jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: deploy-services
        name: Deploy ECS Services
        uses: ./.github/actions/doorway_environment_infra
        with:
          ENVIRONMENT: dev
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: deploy-services
        name: Deploy ECS Services
        uses: ./.github/actions/doorway_environment_infra
        with:
          ENVIRONMENT: staging
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
  deploy-prod:
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-staging]
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: deploy-services
        name: Deploy ECS Services
        uses: ./.github/actions/doorway_environment_infra
        with:
          ENVIRONMENT: prod
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
