name: Doorway Services Deploy
description: Creates the Doorway ECS Services Infrastructure
runs:
  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 18
  - name: install cdk
    run: npm install -g aws-cdk
  - name: yarn-install-services
    working-directory: ./doorway-services
    run: yarn install
  - name: synth-services
    run: cdk synth
    working-directory: ./doorway-services
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-1
      ENVIRONMENT: $ENVIRONMENT
  - name: deploy-services
    run: cdk deploy --all --require-approval never
    working-directory: ./doorway-services
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-1
      ENVIRONMENT: $ENVIRONMENT
